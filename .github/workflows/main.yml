name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Build and package
        run: dotnet cake build.cake
        env:
          GITHUB_ACTIONS: true

      - uses: actions/upload-artifact@v4
        with:
          name: NuGet Packages
          path: BuildOutput/NugetPackages/**/*.nupkg
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install GTK runtime and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0

      - name: Restore tools
        run: dotnet tool restore

      - name: Build and run tests under Xvfb
        run: xvfb-run -a dotnet cake build.cake --BuildTarget=Test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  performance:
    name: Performance (advisory)
    runs-on: ubuntu-24.04
    # Advisory until the thresholds have been stable for a few runs. Flip this
    # to false to make performance a required gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install GTK runtime and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0

      - name: Restore tools
        run: dotnet tool restore

      - name: Run performance tests under Xvfb
        run: xvfb-run -a dotnet cake build.cake --BuildTarget=TestPerformance

  arm64-smoke:
    name: ARM64 workload smoke test
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Verify ARM64 runner
        run: test "$(uname -m)" = "aarch64"

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-dev

      - name: Install .NET SDK 10.0
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
          bash /tmp/dotnet-install.sh --channel 10.0 --install-dir "$HOME/dotnet" --no-path
          echo "$HOME/dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/dotnet" >> "$GITHUB_ENV"

      - name: Restore tools
        run: dotnet tool restore

      - name: Build and install workload
        run: dotnet cake build.cake --BuildTarget=InstallWorkload --BuildVersion=3.24.24.1

      - name: Run ARM64 smoke test
        run: xvfb-run -a dotnet run --project Source/Tests/GtkSharp.SmokeTest/GtkSharp.SmokeTest.csproj -c Release

  publish:
    name: Publish packages
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    needs: [build, test]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: NuGet Packages
          path: packages

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Push NuGet to GitHub packages
        run: dotnet nuget push "packages/**/*.nupkg" --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }}
